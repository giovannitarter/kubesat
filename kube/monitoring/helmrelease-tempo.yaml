---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      version: '3.2.*'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system

      interval: 5m

  install:
    timeout: 5m
    crds: CreateReplace

  upgrade:
    timeout: 5m
    crds: CreateReplace

  values:
    replicas: 1

    tempo:
      # Trace retention period
      retention: 24h

      # Local storage for initial deployment
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

      # Receive traces via OpenTelemetry
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    # Persistent storage
    persistence:
      enabled: true
      size: 2Gi

    service:
      type: ClusterIP
