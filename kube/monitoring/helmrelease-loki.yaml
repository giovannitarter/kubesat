---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: '18.17.*'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system

      interval: 5m

  install:
    timeout: 5m
    crds: CreateReplace

  upgrade:
    timeout: 5m
    crds: CreateReplace

  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        allow_structured_metadata: true

    singleBinary:
      replicas: 1

      persistence:
        enabled: true
        size: 2Gi

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    # Disable other deployment modes
    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    ingester:
      replicas: 0

    querier:
      replicas: 0

    queryFrontend:
      replicas: 0

    queryScheduler:
      replicas: 0

    distributor:
      replicas: 0

    compactor:
      replicas: 0

    indexGateway:
      replicas: 0

    bloomPlanner:
      replicas: 0

    bloomBuilder:
      replicas: 0

    bloomGateway:
      replicas: 0

    minio:
      enabled: false
