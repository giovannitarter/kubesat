---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '92.*.*'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repo
        namespace: flux-system

      interval: 5m

  install:
    timeout: 5m
    crds: CreateReplace

  upgrade:
    timeout: 5m
    crds: CreateReplace

  values:

    crds:
      upgradeJob:
        enabled: true

    grafana:
      enabled: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi

      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

      extraLabels:
        app: grafana

      admin:
        existingSecret: grafana-admin-credentials  # pragma: allowlist secret
        userKey: GF_SECURITY_ADMIN_USER
        passwordKey: GF_SECURITY_ADMIN_PASSWORD  # pragma: allowlist secret

      forceDeployDatasources: true
      forceDeployDashboards: true
      defaultDashboardsEnabled: true
      operator:
        dashboardsConfigMapRefEnabled: true
        matchLabels:
          app: grafana

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi

      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

    prometheus:
      prometheusSpec:
        retention: 24h
        scrapeInterval: 60s
        resources:
          requests:
            cpu: 100m
            memory: 512Mi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring

spec:
  interval: 5m
  chart:
    spec:
      chart: grafana-operator
      version: '5.25.*'
      sourceRef:
        kind: HelmRepository
        name: grafana-repo
        namespace: flux-system
      interval: 5m

  install:
    timeout: 5m
    crds: CreateReplace

  upgrade:
    timeout: 5m
    crds: CreateReplace

  values:
    crds:
      immutable: false
    namespaceScope: true
    rbac:
      create: true
    serviceAccount:
      create: true
