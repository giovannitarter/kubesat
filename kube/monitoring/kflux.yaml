---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system

spec:

  interval: 5m
  timeout: 10m

  path: "./kube/monitoring"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn: []

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-conf
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/monitoring/grafana_conf"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn:

    - name: monitoring
      namespace: flux-system

  targetNamespace: monitoring
