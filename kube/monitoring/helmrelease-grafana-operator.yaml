---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring

spec:
  interval: 5m
  chart:
    spec:
      chart: grafana-operator
      version: '5.25.*'
      sourceRef:
        kind: HelmRepository
        name: grafana-repo
        namespace: flux-system
      interval: 5m

  install:
    timeout: 5m
    crds: CreateReplace

  upgrade:
    timeout: 5m
    crds: CreateReplace

  values:
    crds:
      immutable: false
    namespaceScope: true
    rbac:
      create: true
    serviceAccount:
      create: true
