---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aggiorna-sentieri

resources:
  - ./namespace.yaml
  - ../shared-secrets/sentieri-webapp.secret.yaml
  - ../shared-secrets/sat2018-ssh.secret.yaml
  - ../shared-secrets/aggiorna-sentieri.secret.yaml
  - ./volumes.yaml
  - ./sentieri-download-cronjob.yaml
  - ./sentieri-download-bootstrap-job.yaml


replacements:
  - source:
      kind: CronJob
      name: sentieri-download
      fieldPath: spec.jobTemplate.spec
    targets:
      - select:
          kind: Job
          name: sentieri-download-bootstrap
        fieldPaths:
          - spec
