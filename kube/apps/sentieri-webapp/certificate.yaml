---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentieri-webapp-tls
  namespace: sentieri-webapp
spec:
  secretName: sentieri-webapp-tls

  dnsNames:
    - sentieri.ksat.pupillo.org

  issuerRef:
    name: cloudflare-letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
