---
apiVersion: batch/v1
kind: Job
metadata:
  name: borgmatic-restore-sentieri-db
  namespace: backup
spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: borgmatic-restore-sentieri-db

    spec:
      restartPolicy: Never

      containers:
        - name: borgmatic
          image: ghcr.io/borgmatic-collective/borgmatic:latest

          command: ["/bin/sh", "-ecx"]
          args:
            - |
              archive="$(
                borgmatic repo-list \
                  --repository='ssh://borg@pupillo.org:22016/home/borg/backups' \
                  --match-archives='sentieri.sat.tn.it*' \
                  --sort-by=timestamp \
                  --last=1 \
                  --short | grep -v "Listing"
              )"

              if [ -z "$archive" ]; then
                echo "No archive found" >&2
                exit 1
              fi

              echo "Restoring archive: $archive"

              borgmatic restore \
                --repository='ssh://borg@pupillo.org:22016/home/borg/backups' \
                --archive="$archive" \
                --database=sentieri \
                --original-port=5432

          volumeMounts:
            - name: ssh
              mountPath: /root/.ssh
              readOnly: true

            - name: borgmatic-config
              mountPath: /etc/borgmatic.d/config.yaml
              subPath: config.yaml
              readOnly: true

            - name: borg-passphrase
              mountPath: /run/secrets/borgmatic
              readOnly: true

            - name: borgmatic-database
              mountPath: /run/secrets/borgmatic-database
              readOnly: true

      volumes:
        - name: ssh
          secret:
            secretName: borgmatic-ssh
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
                mode: 0400
              - key: id_ed25519.pub
                path: id_ed25519.pub
                mode: 0444
              - key: known_hosts
                path: known_hosts
                mode: 0444

        - name: borg-passphrase
          secret:
            secretName: borgmatic-passphrase
            defaultMode: 0400
            items:
              - key: passphrase
                path: passphrase
                mode: 0400

        - name: borgmatic-config
          configMap:
            name: borgmatic-config

        - name: borgmatic-database
          secret:
            secretName: borgmatic-database
            defaultMode: 0400
