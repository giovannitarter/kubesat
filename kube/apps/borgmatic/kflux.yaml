---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: borgmatic
  namespace: flux-system

spec:
  interval: 5m
  path: "./kube/apps/borgmatic"
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn:
    - name: sentieri-db
      namespace: flux-system
