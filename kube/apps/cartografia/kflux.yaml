---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cartografia
  namespace: flux-system

spec:
  interval: 5m
  path: ./kube/apps/cartografia
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn:
    - name: namespaces
      namespace: flux-system
    - name: borgmatic
      namespace: flux-system
