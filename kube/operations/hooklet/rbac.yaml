---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hooklet
  namespace: hooklet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hooklet-job-trigger
  namespace: builder
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hooklet-job-trigger
  namespace: builder
subjects:
  - kind: ServiceAccount
    name: hooklet
    namespace: hooklet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hooklet-job-trigger
