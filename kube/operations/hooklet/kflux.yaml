---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hooklet
  namespace: flux-system
spec:
  interval: 5m
  path: "./kube/operations/hooklet/"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: builder
      namespace: flux-system
    - name: gateway
      namespace: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age
