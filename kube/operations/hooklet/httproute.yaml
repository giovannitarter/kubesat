---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hooklet
  namespace: hooklet
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - hooklet.ksat.pupillo.org
  rules:
    - matches:
        - path:
            type: Exact
            value: /webhook
      backendRefs:
        - name: hooklet
          port: 80
          weight: 1
