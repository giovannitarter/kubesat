---

apiVersion: kustomize.toolkit.fluxcd.io/v1

kind: Kustomization

metadata:
  name: builder
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/operations/builder/"
  prune: true
  force: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: zot
      namespace: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age
