---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 1h
  chart:
    spec:
      chart: zot
      version: '2.1.*'
      sourceRef:
        kind: HelmRepository
        name: zot-repo
        namespace: flux-system
      interval: 1h

  install:
    timeout: 5m

  upgrade:
    timeout: 5m

  values: {}
