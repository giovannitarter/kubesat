---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs-operator
      version: '0.1.45'
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator-repo
        namespace: flux-system
      interval: 1h

  install:
    timeout: 10m

  upgrade:
    timeout: 10m

  values:
    crds:
      create: true
    watchNamespaces:
      - storage
