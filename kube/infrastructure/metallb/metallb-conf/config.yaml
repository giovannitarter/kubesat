---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.83/32

  autoAssign: false

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: zot
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.84/32

  autoAssign: false

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: zot
  namespace: metallb-system
spec:
  ipAddressPools:
    - traefik
    - zot
