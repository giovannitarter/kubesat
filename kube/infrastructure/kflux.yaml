---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/infrastructure/cert-manager"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: sources
      namespace: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/infrastructure/cert-manager/config"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn:
    - name: cert-manager
      namespace: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 5m
  path: "./kube/infrastructure/sources"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn: []

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/infrastructure/gateway"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: cert-manager-config
      namespace: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system

spec:

  interval: 5m
  path: "./kube/infrastructure/zot"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: sources
      namespace: flux-system
    - name: cert-manager-config
      namespace: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 5m
  path: "./kube/infrastructure/metallb"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn: []

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-conf
  namespace: flux-system
spec:
  interval: 5m

  dependsOn:
    - name: metallb
      namespace: flux-system

  path: "./kube/infrastructure/metallb/metallb-conf"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
  namespace: flux-system
spec:
  interval: 5m

  dependsOn: []

  path: "./kube/infrastructure/coredns"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keel
  namespace: flux-system
spec:
  interval: 5m

  dependsOn: []

  path: "./kube/infrastructure/keel"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
