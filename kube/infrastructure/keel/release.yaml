---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keel
  namespace: infra-keel
spec:
  interval: 1h
  chart:
    spec:
      chart: keel
      version: '1.2.*'
      sourceRef:
        kind: HelmRepository
        name: keel-repo
        namespace: flux-system
      interval: 1h

  install:
    timeout: 5m

  upgrade:
    timeout: 5m

  values:
    basicauth:
      enabled: false
