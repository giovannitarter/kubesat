---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: '1.21.*'
      sourceRef:
        kind: HelmRepository
        name: certmanager-repo
        namespace: flux-system
      interval: 1h

  install:
    timeout: 5m

  upgrade:
    timeout: 5m

  values:
    crds:
      enabled: true
    extraArgs:
      - "--enable-gateway-api"
